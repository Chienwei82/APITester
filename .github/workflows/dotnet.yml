name: CI

# Workflow reutilizable: Release lo invoca en cada PR y ademas corre solo en
# los push a la rama principal (main).
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build y tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'APITester.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore APITester.slnx

      - name: Build
        run: dotnet build APITester.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test APITester.slnx --no-build --configuration Release --verbosity normal

  scripts:
    name: Scripts de mantenimiento (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sintaxis
        run: python3 -m compileall -q scripts
