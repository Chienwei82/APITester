name: Release

# Cada PR genera un release (pre-release con tag `pr-<numero>`) y cada tag `v*`
# genera un release definitivo. Assets en todos los casos:
#   - Windows x64: zip con APITester.exe (self-contained, un solo archivo)
#   - Linux x64:   zip con APITester (self-contained, un solo archivo)
#   - Codigo fuente: tar.gz generado con `git archive`
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag del release (ej. v1.0.0). Debe apuntar al commit actual."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- tests
  ci:
    name: CI
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read

  # ------------------------------------------------------- version / tag
  meta:
    name: Calcular version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: Calcular version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              version="pr-${PR_NUMBER}"
              title="PR #${PR_NUMBER}: ${PR_TITLE}"
              ;;
            workflow_dispatch)
              version="${INPUT_VERSION}"
              title="${INPUT_VERSION}"
              if ! printf '%s' "$version" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                echo "::error::Version invalida '${version}'. Usa solo letras, numeros, '.', '_' o '-' (ej. v1.0.0)."
                exit 1
              fi
              ;;
            *)
              version="${REF_NAME}"
              title="${REF_NAME}"
              ;;
          esac

          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

          echo "Release: ${title} (tag ${version})"

  # ---------------------------------------------------------- windows x64
  windows-x64:
    name: Windows x64 (.exe)
    runs-on: ubuntu-latest
    needs: [ci, meta]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'APITester.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restaurar antes de publicar: si nuget.org falla de forma transitoria,
      # el error se ve en este paso en vez de en el publish.
      - name: Restore
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if dotnet restore APITester.Rest/APITester.Rest.csproj --runtime win-x64 --verbosity normal; then
              exit 0
            fi
            echo "::warning::restore fallo (intento ${attempt}/3); reintentando en $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::group::Diagnostico del restore"
          echo "### D: restore del slnx (lo que hace el job de CI)"
          dotnet restore APITester.slnx --verbosity minimal && echo "D OK" || echo "D FALLO"
          echo "### E: restore del proyecto en un solo nodo (--disable-parallel)"
          dotnet restore APITester.Rest/APITester.Rest.csproj --disable-parallel --verbosity normal 2>&1 | tail -40
          echo "### F: restore del proyecto con -m:1"
          dotnet restore APITester.Rest/APITester.Rest.csproj -maxcpucount:1 --verbosity minimal && echo "F OK" || echo "F FALLO"
          echo "::endgroup::"

          echo "::error::no se pudieron restaurar los paquetes NuGet"
          exit 1

      - name: Publicar win-x64
        run: |
          dotnet publish APITester.Rest/APITester.Rest.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            --output build/win-x64

      - name: Empaquetar zip
        run: |
          set -euo pipefail
          stage="build/APITester-${VERSION}-windows-x64"
          mkdir -p "$stage"
          mv build/win-x64/APITester.Rest.exe "$stage/APITester.exe"
          cp APITester.Rest/rest-config.json "$stage/rest-config.json"
          cp README.md LICENSE "$stage/"
          python3 .github/scripts/make-zip.py "$stage" "build/APITester-${VERSION}-windows-x64.zip"
          unzip -l "build/APITester-${VERSION}-windows-x64.zip"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------ linux x64
  linux-x64:
    name: Linux x64 (zip)
    runs-on: ubuntu-latest
    needs: [ci, meta]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'APITester.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if dotnet restore APITester.Rest/APITester.Rest.csproj --runtime linux-x64 --verbosity normal; then
              exit 0
            fi
            echo "::warning::restore fallo (intento ${attempt}/3); reintentando en $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::group::Diagnostico del restore"
          dotnet nuget list source || true
          echo "### A: restore sin RID (como el job de CI)"
          dotnet restore APITester.Rest/APITester.Rest.csproj --verbosity minimal && echo "A OK" || echo "A FALLO"
          echo "### B: restore con RID y NuGetAudit desactivado"
          dotnet restore APITester.Rest/APITester.Rest.csproj --runtime linux-x64 -p:NuGetAudit=false --verbosity minimal && echo "B OK" || echo "B FALLO"
          echo "### C: restore con RID, salida diag (cola)"
          dotnet restore APITester.Rest/APITester.Rest.csproj --runtime linux-x64 --verbosity diagnostic \
            > "$RUNNER_TEMP/diag.log" 2>&1 || true
          tail -60 "$RUNNER_TEMP/diag.log"
          echo "::endgroup::"

          echo "::error::no se pudieron restaurar los paquetes NuGet"
          exit 1

      - name: Publicar linux-x64
        run: |
          dotnet publish APITester.Rest/APITester.Rest.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            --output build/linux-x64

      - name: Empaquetar zip
        run: |
          set -euo pipefail
          stage="build/APITester-${VERSION}-linux-x64"
          mkdir -p "$stage"
          install -m 0755 build/linux-x64/APITester.Rest "$stage/APITester"
          cp APITester.Rest/rest-config.json "$stage/rest-config.json"
          cp README.md LICENSE "$stage/"
          python3 .github/scripts/make-zip.py "$stage" "build/APITester-${VERSION}-linux-x64.zip"
          unzip -l "build/APITester-${VERSION}-linux-x64.zip"

      - name: Smoke test del binario
        run: |
          set -euo pipefail
          "build/APITester-${VERSION}-linux-x64/APITester" --help > /dev/null
          echo "El binario de Linux arranca correctamente."

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/*linux-x64.zip
          if-no-files-found: error

  # --------------------------------------------------------------- release
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [meta, windows-x64, linux-x64]
    # Los PR de forks reciben un token de solo lectura: se empaqueta igual,
    # pero no se puede crear el release.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: Generar codigo fuente (tar.gz)
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="APITester-${VERSION}/" \
            --output="dist/APITester-${VERSION}-source.tar.gz" \
            HEAD
          tar -tzf "dist/APITester-${VERSION}-source.tar.gz" | head -n 5

      - name: Verificar tag existente (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            head="$(git rev-parse HEAD)"
            if [ "$tagged" != "$head" ]; then
              echo "::error::El tag ${TAG} ya existe y apunta a ${tagged}, no a ${head}. Usa otro tag."
              exit 1
            fi
          fi

      - name: Eliminar release previo del PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Reemplazando el release ${TAG} existente."
            gh release delete "${TAG}" --cleanup-tag --yes
          fi

      - name: Crear o actualizar el tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            echo "El tag ${TAG} ya existe: lo creo el push que disparo este workflow."
            exit 0
          fi

          echo "Asegurando el tag ${TAG} en el commit ${GITHUB_SHA}"
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${TAG}"

      - name: Notas del release (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "Release automático del PR #${PR_NUMBER}: ${PR_TITLE}"
            echo
            echo "- Autor: @${AUTHOR}"
            echo "- Rama: ${HEAD_REF} → ${BASE_REF}"
            echo "- Commit: ${SHA}"
            echo "- PR: ${PR_URL}"
            echo
            echo "### Descargas"
            echo
            echo "- APITester-${VERSION}-windows-x64.zip: APITester.exe self-contained para Windows x64 (extraer y ejecutar; no requiere .NET instalado)."
            echo "- APITester-${VERSION}-linux-x64.zip: binario self-contained para Linux x64 (extraer, dar permiso de ejecución y correr; no requiere .NET instalado)."
            echo "- APITester-${VERSION}-source.tar.gz: código fuente completo de este PR."
            echo
            echo "Este release es una pre-release asociada al PR; se reemplaza en cada push nuevo a la rama."
          } > release-notes.md
          cat release-notes.md

      - name: Crear release del PR
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          prerelease: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/APITester-*-windows-x64.zip
            build/APITester-*-linux-x64.zip
            dist/APITester-*-source.tar.gz

      - name: Crear release de version
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/APITester-*-windows-x64.zip
            build/APITester-*-linux-x64.zip
            dist/APITester-*-source.tar.gz

      - name: Resumen
        run: |
          {
            echo "### Release ${TAG}"
            echo
            echo "| Asset | Tamaño |"
            echo "|---|---|"
            for f in build/*.zip dist/*.tar.gz; do
              [ -f "$f" ] || continue
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
